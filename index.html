<!doctype html>
<html lang="ko">

<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/iota-app-icon-v2-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="application-name" content="IOTA Seoul" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IOTA Seoul" />
    <meta name="theme-color" content="#272726" />
    <title>IOTA Seoul CFT</title>
    <!-- Prevent search engine indexing during legal review -->
    <meta name="robots" content="noindex, nofollow" />

    <style>
        html,
        body,
        #root {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: #1F1F1E;
        }

        #app-boot {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #A1A1AA;
            background: #1F1F1E;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
            font-size: 14px;
            font-weight: 600;
        }

        #app-boot::before {
            width: 22px;
            height: 22px;
            content: "";
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: app-boot-spin 0.8s linear infinite;
        }

        @keyframes app-boot-spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <link rel="stylesheet" as="style" href="/fonts/Pretendard/pretendard.css" />

    <script>
        (function () {
            var capacitor = window.Capacitor;
            var isNativeApp = location.protocol === 'capacitor:'
                || location.protocol === 'ionic:'
                || Boolean(capacitor && capacitor.isNativePlatform && capacitor.isNativePlatform());
            var isMobileEntry = location.pathname.replace(/\/$/, '').endsWith('/mobile');

            if (isNativeApp) return;

            if (!isMobileEntry) {
                [
                    'https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;700&display=swap',
                    'https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap'
                ].forEach(function (href) {
                    var fontStylesheet = document.createElement('link');
                    fontStylesheet.rel = 'stylesheet';
                    fontStylesheet.href = href;
                    fontStylesheet.media = 'print';
                    fontStylesheet.onload = function () { this.media = 'all'; };
                    document.head.appendChild(fontStylesheet);
                });
            }

            var loadAnalytics = function () {
                var analyticsScript = document.createElement('script');
                analyticsScript.async = true;
                analyticsScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-QNHPD2C1K4';
                document.head.appendChild(analyticsScript);

                window.dataLayer = window.dataLayer || [];
                window.gtag = function () { window.dataLayer.push(arguments); };
                window.gtag('js', new Date());
                window.gtag('config', 'G-QNHPD2C1K4');
            };

            if (isMobileEntry) {
                window.addEventListener('load', function () {
                    window.setTimeout(loadAnalytics, 1500);
                }, { once: true });
            } else {
                loadAnalytics();
            }
        })();
    </script>

    <script>
        if (navigator.userAgent.indexOf('Win') !== -1) {
            document.documentElement.classList.add('is-windows');
        }
        
        // FOUC (Flash of Unstyled Content) Prevention for Dark Mode
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || !theme) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch (_) {}

        // GitHub Pages SPA redirect restoration
        // Restores path from ?p= query param set by 404.html
        (function() {
            var search = location.search;
            if (search && search.indexOf('?p=') === 0) {
                var decoded = search.slice(3).replace(/~and~/g, '&');
                var qIdx = decoded.indexOf('&q=');
                var path = qIdx >= 0 ? decoded.slice(0, qIdx) : decoded;
                var query = qIdx >= 0 ? '?' + decoded.slice(qIdx + 3) : '';
                // Remove trailing slash and index.html from pathname to avoid path corruption
                var base = location.pathname.split('?')[0].replace(/index\.html$/, '').replace(/\/$/, '');
                history.replaceState(null, null, base + path + query + location.hash);
            }
        })();
    </script>
</head>

<body>
    <div id="root">
        <div id="app-boot" role="status" aria-live="polite">IOTA Seoul을 여는 중...</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
